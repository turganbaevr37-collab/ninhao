<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Портфолио — Алипбай Тогжан | Абитуриент MNU</title>
  <style>
    :root {
      --bg: #0b1320;
      --surface: #132033;
      --surface-hover: #1a2b44;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --border: rgba(148, 163, 184, 0.16);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Навигация */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(11, 19, 32, 0.88);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 68px;
      gap: 16px;
    }

    .logo {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .logo span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    /* Герой-блок */
    .hero {
      padding: 80px 0 56px;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: clamp(2.1rem, 4.8vw, 3.2rem);
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 18px;
    }

    .hero p {
      color: var(--muted);
      font-size: 1.08rem;
      max-width: 680px;
      margin-bottom: 28px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.94rem;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: var(--accent);
      color: #062538;
    }

    .btn-primary:hover {
      background: #7dd3fc;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: var(--surface-hover);
    }

    /* Секции */
    section {
      padding: 58px 0;
      border-top: 1px solid var(--border);
    }

    .section-title {
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .section-subtitle {
      color: var(--muted);
      margin-bottom: 30px;
    }

    /* Сетка */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(275px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(56, 189, 248, 0.45);
    }

    .card h3 {
      font-size: 1.12rem;
      margin-bottom: 10px;
    }

    .card p {
      color: var(--muted);
      font-size: 0.94rem;
      margin-bottom: 14px;
    }

    .meta {
      font-size: 0.82rem;
      color: var(--accent);
      font-weight: 500;
    }

    .card-link {
      display: inline-block;
      margin-top: 6px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .card-link:hover {
      text-decoration: underline;
    }

    /* Мотивационный блок */
    .essay-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      padding: 26px;
      color: var(--text);
    }

    .essay-box p {
      color: var(--muted);
      font-size: 1rem;
    }

    /* Фильтры */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }

    .filter-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.45);
    }

    /* Чек-лист и теги */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .checklist {
      list-style: none;
      display: grid;
      gap: 12px;
    }

    .checklist li {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      display
